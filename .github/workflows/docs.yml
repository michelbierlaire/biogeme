name: Build documentation

on:
  push:
    branches: [master, develop]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tools/docs_examples.py'
      - 'tools/clean_example_artifacts.py'
      - 'tools/import_jed_results.py'
      - 'jed_runs/jed_examples.py'
      - 'jed_runs/jed_examples.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-fast:
    name: Documentation fast profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Synchronize the locked documentation environment
        run: uv sync --locked --group docs

      - name: Validate the hermetic pilot examples
        run: uv run --locked --group docs python tools/docs_examples.py run --profile fast

      - name: Build the fast HTML site
        run: make -C docs html-fast

      - name: Check generated HTML structure
        run: make -C docs check-html

      - name: Check documentation links
        continue-on-error: true
        run: make -C docs linkcheck

      - name: Upload HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biogeme-docs-fast
          path: docs/build/html
          if-no-files-found: warn
