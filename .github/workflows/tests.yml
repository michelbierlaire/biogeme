name: Run tox on multiple OS

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays at 06:00 UTC

# Avoid burning minutes on superseded runs
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Cache tox environments, keyed by OS, Python, and lockfiles
      - name: Cache .tox
        uses: actions/cache@v5
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Synchronize the locked CI environment
        run: uv sync --locked --only-group ci --no-install-project

      - name: Run test suite
        run: uv run --locked --no-sync tox -p auto

      # Optional: upload junit/coverage if you generate them in tox
      # - name: Upload test reports
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
      #     path: |
      #       .tox/**/junit*.xml
      #       .tox/**/coverage*.xml
