# Configuration for the JED example runner.
#
# The runner discovers every docs/source/examples/**/plot_*.py file. This file
# contains the cluster defaults and exceptional dependency edges; it does not
# need one entry per example.

[cluster]
# The path used by the current JED setup_biogeme.sh documentation. Override
# these values at run time with BIOGEME_JED_REPOSITORY and BIOGEME_JED_PYTHON.
repository = "$HOME/github/biogeme"
python = "$HOME/github/biogeme/.venv/bin/python"
module = "gcc"
gcc_include = "/usr/lib/gcc/x86_64-redhat-linux/11/include"
state_directory = ".jed_runs"

[profiles.standard]
cpus_per_task = 36
time = "70:00:00"
blas_threads = 36
xla_devices = 36

[profiles.bayesian]
cpus_per_task = 36
time = "70:00:00"
blas_threads = 36
xla_devices = 36

[profiles.montecarlo]
cpus_per_task = 36
time = "70:00:00"
blas_threads = 36
xla_devices = 36

[profiles.panel_simulation]
# High-draw panel simulations need the same CPU layout as the maintained
# manual panel-simulation job, plus an explicit memory request.
cpus_per_task = 36
mem_per_cpu = "7000M"
time = "70:00:00"
blas_threads = 36
xla_devices = 36

[profiles.hybrid]
# H04 uses 50,000 Monte-Carlo draws and needs a larger memory allocation.
# JED limits memory to 7,000 MB per CPU on the standard partition, so request
# 18 CPUs to obtain approximately 126 GB for the single-process job.
cpus_per_task = 18
mem_per_cpu = "7000M"
time = "2-00:00:00"
partition = "standard"
qos = "serial"
blas_threads = 1
xla_devices = 0

[profiles.light]
# Non-estimation examples should not reserve 36 cores for a short report.
cpus_per_task = 4
time = "04:00:00"
blas_threads = 4
xla_devices = 4

# Each job key is relative to docs/source/examples. Dependencies are submitted
# as independent Slurm jobs using --dependency=afterok:<job ids>.

[jobs."assisted/plot_b09post_processing.py"]
depends_on = ["assisted/plot_b07everything_assisted.py"]
required_inputs = ["saved_results/b07everything_assisted.pareto"]

